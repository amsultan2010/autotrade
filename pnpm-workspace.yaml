packages:
  - "web"
  - "engine"
  - "worker"
  - "shared"

# pnpm 11 blocks dependency build scripts by default. These packages have
# legitimate native/codegen postinstall steps and are trusted.
allowBuilds:
  "@clerk/shared": true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  "@sentry/cli": true
  argon2: true
  bufferutil: true
  core-js: true
  electron: true
  esbuild: true
  sharp: true
  utf-8-validate: true
