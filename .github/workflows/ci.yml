name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/check-boundaries.sh
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @autotrade/shared build
      - run: pnpm --filter @autotrade/worker build
      - run: pnpm --filter @autotrade/web build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          BOT_INTERNAL_SECRET: ci_placeholder_secret_32_chars_minimum
          CRON_SECRET: ci_placeholder_cron_secret_32_chars
          BROKER_ENCRYPTION_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          MARKET_DATA_PROVIDER: alpaca
          BILLING_ENABLED: "false"
